<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ja' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="home-link">
        {% if page.lang == 'en' %}← Legal Documents{% else %}← 法務文書一覧{% endif %}
      </a>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        {% if page.lang == 'en' %}
          Contact: <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        {% else %}
          お問い合わせ: <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
        {% endif %}
      </p>
      <p class="copyright">{{ site.author.name }}</p>
    </div>
  </footer>
</body>
</html>
